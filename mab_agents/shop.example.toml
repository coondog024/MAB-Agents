# Shop profile. Copy to shop.toml and edit. Everything the agents say about the
# shop (name, hours, rates, DRPs, targets) comes from here, never from the model.

[shop]
name = "Mullikin's Auto Body"
short_name = "Mullikin's"
phone = "(000) 000-0000"
address = "123 Main St, Anytown, MD 00000"
state = "MD"                 # drives the total-loss threshold lookup
hours = "Mon-Fri 7:30am-5:30pm, Sat by appointment"
website = "https://example.com"
review_url = "https://g.page/r/your-google-review-link"
manager = "Shop Manager"
# Certifications you actually hold. Agents only cite these.
certifications = ["I-CAR Gold Class"]
# Your written warranty, as you would say it to a customer. Leave empty to say nothing about warranty.
warranty = "Limited lifetime warranty on workmanship and paint for as long as you own the vehicle; parts carry the manufacturer's or vendor's warranty"
# Total-loss rule for your state, verified against the current statute by a human: a percentage of ACV
# like "75", or "TLF" for total-loss-formula states (repair + salvage >= ACV). Overrides the reference table.
# Maryland: Transportation Article 11-152 uses 75% of fair market value. Re-check the statute yearly.
total_loss_rule = "75"
total_loss_rule_verified = "2026-10-21"
# Direct repair program (DRP) partners. Agents follow each carrier's rules listed below.
drps = ["Example Mutual", "Sample Insurance"]

[rates]
body = 58.00
refinish = 58.00
mechanical = 110.00
structural = 75.00
diagnostic = 125.00
paint_materials_per_hour = 38.00
shop_materials_per_hour = 4.00
storage_per_day = 65.00
teardown_fee = 250.00

[targets]
touch_time_hours_per_day = 3.5      # labor hours applied per calendar day in production
cycle_time_days = 9.0               # keys-to-keys average
supplement_ratio_max = 0.30         # supplement $ / original estimate $
csi_min = 92.0
parts_gross_profit = 0.28
labor_gross_profit = 0.60
stalled_after_days = 2              # no stage change for this many days = flag it

[parts]
# How the shop prices parts. Dealers sell OEM to shops below list and the shop bills list;
# aftermarket / recycled are bought at a quoted cost and marked up.
oem_dealer_discount = 0.25        # our cost = list x (1 - 0.25)
aftermarket_markup = 0.35         # we bill cost x 1.35
recycled_markup = 0.30
reconditioned_markup = 0.30
sublet_markup = 0.25
rental_cost_per_day = 45.00       # what one day of delay costs when comparing a cheap slow part to a fast one
preferred_vendors = ["Toyota dealer - Anytown", "Honda dealer - Anytown", "Ford dealer - Anytown", "LKQ / Keystone"]
# Where the Parts agent looks when asked to source a part online (it uses web search).
online_sources = ["the brand's dealer parts site", "RockAuto", "Amazon", "eBay Motors", "LKQ Online", "CarParts.com"]

[knowledge]
dir = "knowledge"                 # drop PDFs, .md, .txt, .csv here and run `mab kb sync`
chunk_chars = 2200
overlap_chars = 250
# `mab kb fetch` downloads the URLs listed in knowledge/sources.toml into this folder.

# CRISMA (FoxPro) shop management system. Read-only: MAB never writes to CRISMA tables.
[crisma]
data_dir = "M:/Crisma/data"       # folder holding BSRO.DBF and BSLOC.DBF (UNC paths work: //Mabserver/share/Crisma/data)
ro_table = "BSRO.DBF"
status_table = "BSLOC.DBF"
skip_codes = ["NS", "DNR"]        # no-show / did not repair: not imported
# LOCCD -> MAB stage. Codes not listed here fall back on dates: in-date set -> checked_in, else scheduled.
[crisma.status_map]
OL = "checked_in"                 # ON LOT (READY FOR REPAIRS)
OLW = "approval"                  # ON LOT (NO AUTHORIZATION)
OLP = "parts_ordered"             # ON LOT (NEED PARTS)
TD = "blueprint"                  # DISASSEMBLY & SUPP. INSPECTION
SUP = "approval"                  # WAITING FOR SUPP APPROVAL
UPL = "parts_ordered"             # PART ON BACK ORDER
NTC = "parts_ordered"             # NEED TO CALL WHEN PART IS HERE
CPH = "parts_received"            # CALLED THAT PART IS HERE
IB = "body"                       # IN BODY REPAIR
IBS = "body"                      # IN BODY REPAIR - SUPP PARTS ON ORDER
SUB = "body"                      # OUT FOR SUBLET REPAIRS
CBK = "body"                      # COME BACK IP
REF = "paint"                     # IN PAINT PROCESS
IRA = "reassembly"                # IN REASSEMBLY
CLN = "qc"                        # IN CLEAN UP
FI = "qc"                         # READY FOR FINAL INSPECTION
VF = "ready"                      # READY FOR CUSTOMER PICKUP
VFS = "ready"                     # ON LOT FINISHED / HAS SUPPLEMENT
CA = "delivered"                  # CUSTOMER ACCEPTED
CAS = "delivered"                 # CUST ACCEPT NEED TO SEND SUPP.
CSS = "delivered"                 # CUST ACCEPT SUPP SENT TO INS CO
TL = "approval"                   # TOTAL LOSS (flagged total_loss)

# CCC ONE EMS export. CCC writes one job per UNQFILE_ID: <id>.env .veh .ad1 .ad2 .lin .ttl ... (DBF),
# or a single <id>.EST XML file depending on the export profile.
[ems]
export_dir = "//Mabserver/apps/CCC/EMSOUT"
poll_seconds = 30
# How to pick the RO number: first non-empty of these EMS fields, else "E-<UNQFILE_ID>".
# Put the CRISMA RO number in CCC's RO field and the two systems line up exactly.
ro_number_fields = ["ENV.RO_ID", "AD2.EST_FILENO"]

[sms]
max_chars = 300
signature = "- Mullikin's Auto Body"

# Per-carrier rules the Parts and Insurance agents follow. Add one block per DRP.
# parts_preference is the human-readable rule the agents quote. The structured fields
# below it are what the Parts tools actually apply: a part type is only recommended when the
# line description matches one of the listed part names and the vehicle is old enough.
[[carrier_rules]]
name = "Example Mutual"
parts_preference = "OEM on current-year, aftermarket CAPA-certified allowed on 2+ model years for cosmetic parts, recycled allowed on assemblies"
aftermarket_allowed_parts = ["bumper cover", "fascia", "grille", "headlamp", "tail lamp", "mirror", "fender", "hood"]
aftermarket_min_age_years = 2
recycled_allowed_parts = ["door", "liftgate", "deck lid", "assembly", "engine", "transmission", "axle"]
recycled_min_age_years = 2
aftermarket_max_markup = 0.35
supplement_photos_required = true
pre_post_scan_covered = true
rental_max_days = 30
notes = "Submit supplements through the carrier portal within 24h of teardown."

[[carrier_rules]]
name = "Sample Insurance"
parts_preference = "OEM only on vehicles under 12 months, otherwise aftermarket allowed on bumper covers and lamps"
aftermarket_allowed_parts = ["bumper cover", "fascia", "headlamp", "tail lamp"]
aftermarket_min_age_years = 1
recycled_allowed_parts = []
supplement_photos_required = true
pre_post_scan_covered = true
rental_max_days = 25
notes = "Call the desk adjuster before any structural pull."
